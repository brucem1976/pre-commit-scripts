- id: prettier
  name: Prettier (commit-specific)
  description: Triggers the consumer's local Prettier formatter
  entry: yarn prettier --write
  language: system
  types: [text]
  files: \.(js|jsx|ts|tsx|json|md)$
  pass_filenames: true
  stages: [commit]

- id: eslint
  name: ESLint (commit-specific)
  description: Triggers the consumer's local ESLint auto-fixer
  entry: yarn eslint --fix
  language: system
  types: [text]
  files: \.(js|jsx|ts|tsx)$
  pass_filenames: true
  stages: [commit]

- id: jest
  name: Jest (commit-specific)
  description: Triggers local Jest specifically for files pushed in the commit
  entry: yarn test --bail --findRelatedTests --passWithNoTests
  language: system
  types: [text]
  files: \.(js|jsx|ts|tsx)$
  pass_filenames: true
  stages: [commit]

- id: check-branch-name
  name: Enforce JIRA Branch Naming Convention
  description: Validates branch starts with feature/task/bugfix, has a JIRA ticket, and lowercase words.
  entry: ./check-branch-name.sh
  language: script
  pass_filenames: false
  stages: [commit]

- id: check-commit-msg
  name: Enforce JIRA Commit Message Prefix
  description: Verifies commit message starts with the JIRA ticket from the active branch
  entry: ./check-commit-msg.sh
  language: script
  stages: [commit-msg]

- id: block-dependency-changes
  name: Block Dependency Updates
  description: Explicitly forbids developers from committing changes to yarn.lock or package-lock.json
  entry: |
    echo -e "\n\033[1;31m❌ ERROR: Unauthorized Dependency Change Detected!\033[0m"
    echo "You have modified a configuration file ('package.json', 'yarn.lock' or 'package-lock.json')."
    echo "Developers are explicitly forbidden from upgrading or adding new NPM dependencies natively."
    echo "Please revert your changes to pass this Pipeline."
    exit 1
  language: fail
  files: ^(yarn\.lock|package-lock\.json|package\.json)$
  stages: [commit]

- id: check-pr-approvers
  name: Enforce Required PR Approvers
  description: Validates that all members specified in REQUIRED_CHECKERS have approved the Pull Request in Bitbucket.
  entry: ./check-pr-approvers.sh
  language: script
  pass_filenames: false
  stages: [manual]

- id: pr-compliance
  name: JIRA PR Compliance Check
  description: Validates PR compliance with JIRA requirements
  entry: ./pr-compliance.sh
  language: script
  pass_filenames: false
  stages: [manual]

- id: install-dependencies
  name: Install Clean Dependencies
  description: Installs dependencies with frozen lockfile
  entry: bash -c 'yarn install --frozen-lockfile'
  language: system
  pass_filenames: false
  stages: [manual]

- id: type-check
  name: TypeScript Type Check
  description: Validates TypeScript constraints across the project
  entry: bash -c 'yarn type-check'
  language: system
  pass_filenames: false
  require_serial: false
  stages: [manual]

- id: lint
  name: ESLint Code Style (Global)
  description: Enforces global code style with ESLint
  entry: bash -c 'yarn lint'
  language: system
  pass_filenames: false
  require_serial: false
  stages: [manual]

- id: test
  name: Jest Test Suites (Global)
  description: Runs all Jest test suites
  entry: bash -c 'yarn test'
  language: system
  pass_filenames: false
  require_serial: false
  stages: [manual]

- id: audit
  name: Security Audit
  description: Audits dependencies for critical security vulnerabilities
  entry: bash -c 'yarn audit --level critical'
  language: system
  pass_filenames: false
  require_serial: false
  stages: [manual]
